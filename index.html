<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بازی کلمات هم‌آغاز - نگاره ۴</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: Tahoma, sans-serif;
  background: linear-gradient(135deg, #FFD3E0 0%, #FFE5B4 25%, #B5EAD7 50%, #C7CEEA 75%, #FFD3E0 100%);
  background-size: 400% 400%;
  animation: rainbow 15s ease infinite;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 15px;
}
@keyframes rainbow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
.bubble {
  position: fixed;
  border-radius: 50%;
  opacity: 0.4;
  pointer-events: none;
  animation: float 8s ease-in-out infinite;
  z-index: 0;
}
@keyframes float {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-30px) scale(1.1); }
}
.container {
  background: rgba(255, 255, 255, 0.95);
  border-radius: 35px;
  box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15), 0 0 0 6px rgba(255, 255, 255, 0.5);
  padding: 25px;
  max-width: 650px;
  width: 100%;
  text-align: center;
  position: relative;
  z-index: 1;
}
.music-btn {
  position: absolute;
  top: 15px;
  left: 15px;
  background: linear-gradient(135deg, #FFB6C1, #FF69B4);
  border: none;
  border-radius: 50%;
  width: 55px;
  height: 55px;
  font-size: 24px;
  cursor: pointer;
  box-shadow: 0 5px 15px rgba(255, 105, 180, 0.4);
  z-index: 10;
}
.music-btn.off { opacity: 0.5; filter: grayscale(1); }
h1 {
  color: #E91E63;
  font-size: 34px;
  font-weight: 900;
  margin-bottom: 5px;
  text-shadow: 2px 2px 0 #FFE082;
}
.subtitle {
  color: #7E57C2;
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 18px;
}
.score-bar {
  display: flex;
  justify-content: space-around;
  background: linear-gradient(135deg, #FFF9C4, #FFECB3);
  border-radius: 20px;
  padding: 14px;
  margin-bottom: 18px;
  font-size: 19px;
  font-weight: 900;
  color: #5D4037;
}
.score-bar span { color: #E91E63; font-size: 22px; }
.question-box {
  background: linear-gradient(135deg, #E1F5FE, #B3E5FC);
  border: 5px dashed #03A9F4;
  border-radius: 25px;
  padding: 20px 15px;
  margin-bottom: 20px;
}
.question-text {
  font-size: 22px;
  color: #01579B;
  font-weight: 700;
  margin-bottom: 12px;
}
.main-word-emoji {
  font-size: 80px;
  line-height: 1;
  margin-bottom: 8px;
  animation: bounce 2s ease infinite;
}
@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}
.main-word {
  font-size: 65px;
  font-weight: 900;
  color: #D32F2F;
  text-shadow: 3px 3px 0 #FFE082;
}
.options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-bottom: 18px;
}
.option-btn {
  background: linear-gradient(135deg, #FFF, #F5F5F5);
  border: 4px solid #FFB6C1;
  border-radius: 22px;
  padding: 18px 10px;
  font-size: 30px;
  font-weight: 900;
  cursor: pointer;
  font-family: inherit;
  color: #4A148C;
  box-shadow: 0 6px 0 #FFB6C1;
}
.option-btn:nth-child(1) { border-color: #FF6B9D; box-shadow: 0 6px 0 #FF6B9D; }
.option-btn:nth-child(2) { border-color: #4ECDC4; box-shadow: 0 6px 0 #4ECDC4; }
.option-btn:nth-child(3) { border-color: #FFD93D; box-shadow: 0 6px 0 #FFD93D; }
.option-btn:nth-child(4) { border-color: #A78BFA; box-shadow: 0 6px 0 #A78BFA; }
.option-btn .emoji {
  font-size: 44px;
  display: block;
  margin-bottom: 6px;
}
.option-btn.correct {
  background: linear-gradient(135deg, #66BB6A, #43A047);
  border-color: #2E7D32;
  box-shadow: 0 6px 0 #2E7D32;
  color: white;
}
.option-btn.wrong {
  background: linear-gradient(135deg, #EF5350, #E53935);
  border-color: #B71C1C;
  box-shadow: 0 6px 0 #B71C1C;
  color: white;
}
.option-btn:disabled { cursor: not-allowed; }
.feedback {
  font-size: 24px;
  font-weight: 900;
  min-height: 38px;
  margin-bottom: 12px;
}
.feedback.good { color: #2E7D32; }
.feedback.bad { color: #C62828; }
.next-btn {
  background: linear-gradient(135deg, #42A5F5, #1E88E5);
  color: white;
  border: none;
  border-radius: 20px;
  padding: 16px 45px;
  font-size: 22px;
  font-weight: 900;
  cursor: pointer;
  font-family: inherit;
  display: none;
  box-shadow: 0 6px 0 #0D47A1;
}
.end-screen { display: none; }
.end-screen h2 {
  font-size: 38px;
  color: #E91E63;
  margin-bottom: 15px;
  text-shadow: 2px 2px 0 #FFE082;
}
.end-screen .final-score {
  font-size: 80px;
  color: #43A047;
  font-weight: 900;
  margin: 15px 0;
  text-shadow: 3px 3px 0 #FFE082;
}
.restart-btn {
  background: linear-gradient(135deg, #FF9800, #F57C00);
  color: white;
  border: none;
  border-radius: 20px;
  padding: 16px 45px;
  font-size: 22px;
  font-weight: 900;
  cursor: pointer;
  font-family: inherit;
  margin-top: 15px;
  box-shadow: 0 6px 0 #E65100;
}
.confetti {
  position: fixed;
  width: 12px;
  height: 12px;
  pointer-events: none;
  z-index: 100;
  animation: confetti-fall 2s ease-out forwards;
}
@keyframes confetti-fall {
  0% { transform: translateY(0) rotate(0deg); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}
@media (max-width: 500px) {
  .main-word { font-size: 52px; }
  .main-word-emoji { font-size: 65px; }
  h1 { font-size: 26px; }
  .subtitle { font-size: 15px; }
  .question-text { font-size: 18px; }
  .option-btn { font-size: 24px; padding: 15px 6px; }
  .option-btn .emoji { font-size: 36px; }
  .music-btn { width: 48px; height: 48px; font-size: 20px; }
  .score-bar { font-size: 16px; padding: 10px; }
  .score-bar span { font-size: 18px; }
  .feedback { font-size: 20px; }
  .next-btn, .restart-btn { font-size: 18px; padding: 14px 32px; }
}
</style>
</head>
<body>

<div class="bubble" style="width:120px; height:120px; background:#FFB6C1; top:5%; right:5%;"></div>
<div class="bubble" style="width:80px; height:80px; background:#B5EAD7; top:60%; left:3%; animation-delay:2s;"></div>
<div class="bubble" style="width:100px; height:100px; background:#C7CEEA; bottom:5%; right:8%; animation-delay:4s;"></div>

<div class="container">
<button class="music-btn" id="musicBtn">🎵</button>

<div id="gameScreen">
<h1>🎯 کلمات هم‌آغاز</h1>
<p class="subtitle">نگاره ۴ - فارسی پایه اول</p>

<div class="score-bar">
<div>سوال: <span id="qNum">1</span> از <span id="qTotal">6</span></div>
<div>امتیاز: <span id="score">0</span> ⭐</div>
</div>

<div class="question-box">
<div class="question-text">کدام کلمه با کلمه زیر <b>هم‌آغاز</b> است؟</div>
<div class="main-word-emoji" id="mainEmoji">💧</div>
<div class="main-word" id="mainWord">آب</div>
</div>

<div class="feedback" id="feedback"></div>
<div class="options" id="options"></div>
<button class="next-btn" id="nextBtn">سوال بعدی ➡️</button>
</div>

<div class="end-screen" id="endScreen">
<h2 id="endTitle">🎉 آفرین!</h2>
<p style="font-size:24px; color:#555; font-weight:700;">بازی تمام شد</p>
<div class="final-score" id="finalScore">0</div>
<p style="font-size:20px; color:#777; font-weight:700;">از <span id="totalQ">6</span> سوال</p>
<button class="restart-btn" onclick="startGame()">🔄 دوباره بازی کن</button>
</div>
</div>

<script>
let audioCtx = null;
let musicEnabled = true;
let musicInterval = null;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playTone(freq, duration, type, volume, delay) {
  if (!audioCtx) return;
  type = type || 'sine';
  volume = volume || 0.15;
  delay = delay || 0;
  var t = audioCtx.currentTime + delay;
  var osc = audioCtx.createOscillator();
  var gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(volume, t + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + duration);
}

function playCorrectSound() {
  playTone(523.25, 0.12, 'sine', 0.2, 0);
  playTone(659.25, 0.12, 'sine', 0.2, 0.1);
  playTone(783.99, 0.18, 'sine', 0.2, 0.2);
  playTone(1046.5, 0.3, 'sine', 0.2, 0.3);
}

function playWrongSound() {
  playTone(311.13, 0.18, 'sawtooth', 0.13, 0);
  playTone(233.08, 0.3, 'sawtooth', 0.13, 0.16);
}

function playClickSound() {
  playTone(880, 0.05, 'triangle', 0.1, 0);
}

function playEndSound() {
  var notes = [
    [523.25, 0.14], [523.25, 0.14], [523.25, 0.14],
    [523.25, 0.28], [415.30, 0.28], [466.16, 0.28], [523.25, 0.55]
  ];
  var delay = 0;
  notes.forEach(function(n) {
    playTone(n[0], n[1], 'sine', 0.2, delay);
    delay += n[1] + 0.05;
  });
}

function startMusic() {
  if (musicInterval) return;
  var melody = [
    [659.25, 0.35], [659.25, 0.35], [783.99, 0.7],
    [783.99, 0.35], [659.25, 0.35], [587.33, 0.7],
    [523.25, 0.35], [587.33, 0.35], [659.25, 0.7],
    [523.25, 0.5], [392, 0.5], [523.25, 0.8]
  ];
  var totalDur = 0;
  melody.forEach(function(n) { totalDur += n[1] + 0.1; });
  totalDur = totalDur * 1000;

  function playMelody() {
    if (!musicEnabled) return;
    var delay = 0;
    melody.forEach(function(n) {
      playTone(n[0], n[1] * 0.85, 'sine', 0.06, delay);
      playTone(n[0] / 2, n[1] * 0.85, 'triangle', 0.03, delay);
      delay += n[1] + 0.1;
    });
  }
  playMelody();
  musicInterval = setInterval(playMelody, totalDur);
}

function stopMusic() {
  if (musicInterval) {
    clearInterval(musicInterval);
    musicInterval = null;
  }
}

document.getElementById('musicBtn').onclick = function() {
  initAudioetti();
  musicEnabled = !musicEnabled;
  var btn = document.getElementById('musicBtn');
  if (musicEnabled) {
    btn.textContent = '🎵';
    btn.classList.remove('off');
    startMusic();
  } else {
    btn.textContent = '🔇';
    btn.classList.add('off');
    stopMusic();
  }
  playClickSound();
};

function showConfetti() {
  var colors = ['#FF6B9D', '#4ECDC4', '#FFD93D', '#A78BFA', '#FF9800', '#66BB6A'];
  for (var i = 0; i < 40; i++) {
    (function(idx) {
      setTimeout(function() {
        var c = document.createElement('div');
        c.className = 'conf';
        c.style.left = Math.random() * 100 + 'vw';
        c.style.top = '-20px';
        c.style.background = colors[Math.floor(Math.random() * colors.length)];
        c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        c.style.width = (Math.random() * 10 + 8) + 'px';
        c.style.height = c.style.width;
        c.style.animationDuration = (Math.random() * 1.5 + 1.5) + 's';
        document.body.appendChild(c);
        setTimeout(function() { c.remove(); }, 3500);
      }, idx * 30);
    })(i);
  }
}

var questions = [
  {
    word: "آب", emoji: "💧",
    options: [
      { text: "آبی", emoji: "🔵", correct: true },
      { text: "کِتاب", emoji: "📖", correct: false },
      { text: "مُدیر", emoji: "👩‍💼", correct: false },
      { text: "مادَر", emoji: "👩", correct: false }
    ]
  },
  {
    word: "آبی", emoji: "🔵",
    options: [
      { text: "کَفش", emoji: "👟", correct: false },
      { text: "آزادِه", emoji: "🧕", correct: true },
      { text: "مَدرِسِه", emoji: "🏫", correct: false },
      { text: "کیف", emoji: "👜", correct: false }
    ]
  },
  {
    word: "آزادِه", emoji: "🧕",
    options: [
      { text: "مادَر", emoji: "👩", correct: false },
      { text: "کِتاب", emoji: "📖", correct: false },
      { text: "اَمین", emoji: "👦", correct: true },
      { text: "مَسجِد", emoji: "🕌", correct: false }
    ]
  },
  {
    word: "اَمین", emoji: "👦",
    options: [
      { text: "اَنگور", emoji: "🍇", correct: true },
      { text: "کَفش", emoji: "👟", correct: false },
      { text: "کِلاس", emoji: "🏫", correct: false },
      { text: "کیف", emoji: "👜", correct: false }
    ]
  },
  {
    word: "اَنگور", emoji: "🍇",
    options: [
      { text: "مَدرِسِه", emoji: "🏫", correct: false },
      { text: "اَمین", emoji: "👦", correct: true },
      { text: "کِتاب", emoji: "📖", correct: false },
      { text: "آب", emoji: "💧", correct: false }
    ]
  },
  {
    word: "مَدرِسِه", emoji: "🏫",
    options: [
      { text: "کِتاب", emoji: "📖", correct: false },
      { text: "مادَر", emoji: "👩", correct: true },
      { text: "آب", emoji: "💧", correct: false },
      { text: "کیف", emoji: "👜", correct: false }
    ]
  }
];

var currentQ = 0;
var score = 0;
var answered = false;

function startGame() {
  initAudio();
  if (musicEnabled) startMusic();
  currentQ = 0;
  score = 0;
  answered = false;
  document.getElementById('gameScreen').style.display = 'block';
  document.getElementById('endScreen').style.display = 'none';
  document.getElementById('qTotal').textContent = questions.length;
  الان document.getElementById('totalQ').textContent این = questions.length;
  document کار.getElementById('score').textContent = 'و0';
  loadQuestion();
}

function loadQuestion() {
  answered = false;
  var q = questions[currentQ];
  document.getElementById('qNum').textContent = currentQ + 1;
  document.getElementById('mainWord').textContent = q.word;
  document.getElementById('mainEmoji').textContent = q.emoji;
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('nextBtn').style.display = 'none';

  var optsDiv = document.getElementById('options');
  optsDiv.innerHTML = '';
  var shuffled = q.options.slice().sort(function() { return Math.random() - 0.5; });

  shuffled.forEach(function(opt) {
    var btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = '<span class="emoji">' + opt.emoji + '</span>' + opt.text;
    btn.onclick = function() { checkAnswer(btn, opt.correct); };
    optsDiv.appendChild(btn);
  });
}

function checkAnswer(btn, isCorrect) {
  if (answered) return;
  answered = true;

  var allBtns = document.querySelectorAll('.option-btn');
  allBtns.forEach(function(b) { b.disabled = true; });

  var fb = document.getElementById('feedback');

  if (isCorrect) {
    btn.classList.add('correct');
    score++;
    document.getElementById('score').textContent = score;
    fb.textContent = '✅ آفرین! درست بود';
    fb.className = 'feedback good';
    playCorrectSound();
    showConfetti();
  } else {
    btn.classList.add('wrong');
    fb.textContent = '❌ اشتباه بود! دوباره فکر کن';
    fb.className = 'feedback bad';
    playWrongSound();
  }

  document.getElementById('nextBtn').style.display = 'inline-block';
}

document.getElementById('nextBtn').onclick = function() {
  playClickSound();
  currentQ++;
  if (currentQ < questions.length) {
    loadQuestion();
  } else {
    endGame();
  }
};

function endGame() {
  document.getElementById('gameScreen').style.display = 'none';
  document.getElementById('endScreen').style.display = 'block';
  document.getElementById('finalScore').textContent = score;

  var title = document.getElementById('endTitle');
  if (score === questions.length) {
    title.textContent = '🏆 عالی! تو یک قهرمانی!';
    showConfetti();
    setTimeout(showConfetti, 500);
  }
  else if (score >= questions.length / 2) title.textContent = '😊 خوب بود! بازم تمرین کن';
  else title.textContent = '💪 اشکالی نداره، دوباره تلاش کن!';

  playEndSound();
}

document.body.addEventListener('click', function firstClick() {
  initAudio();
  if (musicEnabled && !musicInterval) startMusic();
  document.body.removeEventListener('click', firstClick);
}, { once: true });

startGame();
</script>
</body>
</html>
