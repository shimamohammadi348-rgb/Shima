<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بازی کلمات هم‌آغاز</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: Tahoma, sans-serif;
  background: linear-gradient(135deg, #FFD3E0 0%, #FFE5B4 50%, #B5EAD7 100%);
  background-size: 300% 300%;
  animation: rainbow 12s ease infinite;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 15px;
}
@keyframes rainbow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
.container {
  background: white;
  border-radius: 35px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.2);
  padding: 25px;
  max-width: 650px;
  width: 100%;
  text-align: center;
  position: relative;
}
.music-btn {
  position: absolute;
  top: 15px;
  left: 15px;
  background: linear-gradient(135deg, #FFB6C1, #FF69B4);
  border: none;
  border-radius: 50%;
  width: 55px;
  height: 55px;
  font-size: 24px;
  cursor: pointer;
}
h1 {
  color: #E91E63;
  font-size: 34px;
  font-weight: 900;
  margin-bottom: 5px;
  text-shadow: 2px 2px 0 #FFE082;
}
.subtitle {
  color: #7E57C2;
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 18px;
}
.score-bar {
  display: flex;
  justify-content: space-around;
  background: linear-gradient(135deg, #FFF9C4, #FFECB3);
  border-radius: 20px;
  padding: 14px;
  margin-bottom: 18px;
  font-size: 19px;
  font-weight: 900;
  color: #5D4037;
}
.score-bar span { color: #E91E63; font-size: 22px; }
.question-box {
  background: linear-gradient(135deg, #E1F5FE, #B3E5FC);
  border: 5px dashed #03A9F4;
  border-radius: 25px;
  padding: 20px 15px;
  margin-bottom: 20px;
}
.question-text {
  font-size: 22px;
  color: #01579B;
  font-weight: 700;
  margin-bottom: 12px;
}
.main-word-emoji {
  font-size: 80px;
  line-height: 1;
  margin-bottom: 8px;
}
.main-word {
  font-size: 65px;
  font-weight: 900;
  color: #D32F2F;
  text-shadow: 3px 3px 0 #FFE082;
}
.options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-bottom: 18px;
}
.option-btn {
  background: white;
  border: 4px solid #FFB6C1;
  border-radius: 22px;
  padding: 18px 10px;
  font-size: 28px;
  font-weight: 900;
  cursor: pointer;
  font-family: inherit;
  color: #4A148C;
  box-shadow: 0 6px 0 #FFB6C1;
}
.option-btn .emoji {
  font-size: 42px;
  display: block;
  margin-bottom: 6px;
}
.option-btn.correct {
  background: #66BB6A;
  border-color: #2E7D32;
  color: white;
  box-shadow: 0 6px 0 #2E7D32;
}
.option-btn.wrong {
  background: #EF5350;
  border-color: #B71C1C;
  color: white;
  box-shadow: 0 6px 0 #B71C1C;
}
.feedback {
  font-size: 24px;
  font-weight: 900;
  min-height: 38px;
  margin-bottom: 12px;
}
.feedback.good { color: #2E7D32; }
.feedback.bad { color: #C62828; }
.next-btn {
  background: #42A5F5;
  color: white;
  border: none;
  border-radius: 20px;
  padding: 16px 45px;
  font-size: 22px;
  font-weight: 900;
  cursor: pointer;
  font-family: inherit;
  display: none;
  box-shadow: 0 6px 0 #0D47A1;
}
.end-screen { display: none; }
.end-screen h2 {
  font-size: 38px;
  color: #E91E63;
  margin-bottom: 15px;
}
.final-score {
  font-size: 80px;
  color: #43A047;
  font-weight: 900;
  margin: 15px 0;
}
.restart-btn {
  background: #FF9800;
  color: white;
  border: none;
  border-radius: 20px;
  padding: 16px 45px;
  font-size: 22px;
  font-weight: 900;
  cursor: pointer;
  font-family: inherit;
  margin-top: 15px;
  box-shadow: 0 6px 0 #E65100;
}
@media (max-width: 500px) {
  .main-word { font-size: 52px; }
  .main-word-emoji { font-size: 65px; }
  h1 { font-size: 26px; }
  .option-btn { font-size: 22px; padding: 15px 6px; }
  .option-btn .emoji { font-size: 34px; }
}
</style>
</head>
<body>
<div class="container">
<button class="music-btn" id="musicBtn">🎵</button>
<div id="gameScreen">
<h1>🎯 کلمات هم‌آغاز</h1>
<p class="subtitle">نگاره ۴ - فارسی پایه اول</p>
<div class="score-bar">
<div>سوال: <span id="qNum">1</span> از <span id="qTotal">6</span></div>
<div>امتیاز: <span id="score">0</span> ⭐</div>
</div>
<div class="question-box">
<div class="question-text">کدام کلمه با کلمه زیر هم‌آغاز است؟</div>
<div class="main-word-emoji" id="mainEmoji">💧</div>
<div class="main-word" id="mainWord">آب</div>
</div>
<div class="feedback" id="feedback"></div>
<div class="options" id="options"></div>
<button class="next-btn" id="nextBtn">سوال بعدی ➡️</button>
</div>
<div class="end-screen" id="endScreen">
<h2 id="endTitle">🎉 آفرین!</h2>
<p style="font-size:24px; color:#555; font-weight:700;">بازی تمام شد</p>
<div class="final-score" id="finalScore">0</div>
<p style="font-size:20px; color:#777; font-weight:700;">از <span id="totalQ">6</span> سوال</p>
<button class="restart-btn" onclick="startGame()">🔄 دوباره بازی کن</button>
</div>
</div>

<script>
var audioCtx = null;
var musicEnabled = true;
var musicInterval = null;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playTone(freq, duration, type, volume, delay) {
  if (!audioCtx) return;
  type = type || 'sine';
  volume = volume || 0.15;
  delay = delay || 0;
  var t = audioCtx.currentTime + delay;
  var osc = audioCtx.createOscillator();
  var gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(volume, t + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + duration);
}

function playCorrectSound() {
  playTone(523.25, 0.12, 'sine', 0.2, 0);
  playTone(659.25, 0.12, 'sine', 0.2, 0.1);
  playTone(783.99, 0.18, 'sine', 0.2, 0.2);
  playTone(1046.5, 0.3, 'sine', 0.2, 0.3);
}

function playWrongSound() {
  playTone(311.13, 0.18, 'sawtooth', 0.13, 0);
  playTone(233.08, 0.3, 'sawtooth', 0.13, 0.16);
}

function playClickSound() {
  playTone(880, 0.05, 'triangle', 0.1, 0);
}

function playEndSound() {
  var notes = [
    [523.25, 0.14], [523.25, 0.14], [523.25, 0.14],
    [523.25, 0.28], [415.30, 0.28], [466.16, 0.28], [523.25, 0.55]
  ];
  var delay = 0;
  notes.forEach(function(n) {
    playTone(n[0], n[1], 'sine', 0.2, delay);
    delay += n[1] + 0.05;
  });
}

function startMusic() {
  if (musicInterval) return;
  var melody = [
    [659.25, 0.35], [659.25, 0.35], [783.99, 0.7],
    [783.99, 0.35], [659.25, 0.35], [587.33, 0.7],
    [523.25, 0.35], [587.33, 0.35], [659.25, 0.7],
    [523.25, 0.5], [392, 0.5], [523.25, 0.8]
  ];
  var totalDur = 0;
  melody.forEach(function(n) { totalDur += n[1] + 0.1; });
  totalDur = totalDur * 1000;
  function playMelody() {
    if (!musicEnabled) return;
    var delay = 0;
    melody.forEach(function(n) {
      playTone(n[0], n[1] * 0.85, 'sine', 0.06, delay);
      playTone(n[0] / 2, n[1] * 0.85, 'triangle', 0.03, delay);
      delay += n[1] + 0.1;
    });
  }
  playMelody();
  musicInterval = setInterval(playMelody, totalDur);
}

function stopMusic() {
  if (musicInterval) {
    clearInterval(musicInterval);
    musicInterval = null;
  }
}

document.getElementById('musicBtn').onclick = function() {
  initAudio();
  musicEnabled = !musicEnabled;
  var btn = document.getElementById('musicBtn');
  if (musicEnabled) {
    btn.textContent = '🎵';
    btn.classList.remove('off');
    startMusic();
  } else {
    btn.textContent = '🔇';
    btn.classList.add('off');
    stopMusic();
  }
  playClickSound();
};

var questions = [
  {
    word: "آب", emoji: "💧",
    options: [
      { text: "آبی", emoji: "🔵", correct: true },
      { text: "کِتاب", emoji: "📖", correct: false },
      { text: "مُدیر", emoji: "👩‍💼", correct: false },
      { text: "مادَر", emoji: "👩", correct: false }
    ]
  },
  {
    word: "آبی", emoji: "🔵",
    options: [
      { text: "کَفش", emoji: "👟", correct: false },
      { text: "آزادِه", emoji: "🧕", correct: true },
      { text: "مَدرِسِه", emoji: "🏫", correct: false },
      { text: "کیف", emoji: "👜", correct: false }
    ]
  },
  {
    word: "آزادِه", emoji: "🧕",
    options: [
      { text: "مادَر", emoji: "👩", correct: false },
      { text: "کِتاب", emoji: "📖", correct: false },
      { text: "آب", emoji: "💧", correct: true },
      { text: "مَسجِد", emoji: "🕌", correct: false }
    ]
  },
  {
    word: "اَمین", emoji: "👦",
    options: [
      { text: "اَنگور", emoji: "🍇", correct: true },
      { text: "کَفش", emoji: "👟", correct: false },
      { text: "کِلاس", emoji: "🏫", correct: false },
      { text: "کیف", emoji: "👜", correct: false }
    ]
  },
  {
    word: "اَنگور", emoji: "🍇",
    options: [
      { text: "مَدرِسِه", emoji: "🏫", correct: false },
      { text: "اَمین", emoji: "👦", correct: true },
      { text: "کِتاب", emoji: "📖", correct: false },
      { text: "آب", emoji: "💧", correct: false }
    ]
  },
  {
    word: "مَدرِسِه", emoji: "🏫",
    options: [
      { text: "کِتاب", emoji: "📖", correct: false },
      { text: "مادَر", emoji: "👩", correct: true },
      { text: "آب", emoji: "💧", correct: false },
      { text: "کیف", emoji: "👜", correct: false }
    ]
  }
];

var currentQ = 0;
var score = 0;
var answered = false;

function startGame() {
  initAudio();
  if (musicEnabled) startMusic();
  currentQ = 0;
  score = 0;
  answered = false;
  document.getElementById('gameScreen').style.display = 'block';
  document.getElementById('endScreen').style.display = 'none';
  document.getElementById('qTotal').textContent = questions.length;
  document.getElementById('totalQ').textContent = questions.length;
  document.getElementById('score').textContent = '0';
  loadQuestion();
}

function loadQuestion() {
  answered = false;
  var q = questions[currentQ];
  document.getElementById('qNum').textContent = currentQ + 1;
  document.getElementById('mainWord').textContent = q.word;
  document.getElementById('mainEmoji').textContent = q.emoji;
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('nextBtn').style.display = 'none';
  var optsDiv = document.getElementById('options');
  optsDiv.innerHTML = '';
  var shuffled = q.options.slice().sort(function() { return Math.random() - 0.5; });
  shuffled.forEach(function(opt) {
    var btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = '<span class="emoji">' + opt.emoji + '</span>' + opt.text;
    btn.onclick = function() { checkAnswer(btn, opt.correct); };
    optsDiv.appendChild(btn);
  });
}

function checkAnswer(btn, isCorrect) {
  if (answered) return;
  answered = true;
  var allBtns = document.querySelectorAll('.option-btn');
  allBtns.forEach(function(b) { b.disabled = true; });
  var fb = document.getElementById('feedback');
  if (isCorrect) {
    btn.classList.add('correct');
    score++;
    document.getElementById('score').textContent = score;
    fb.textContent = '✅ آفرین! درست بود';
    fb.className = 'feedback good';
    playCorrectSound();
  } else {
    btn.classList.add('wrong');
    fb.textContent = '❌ اشتباه بود! دوباره فکر کن';
    fb.className = 'feedback bad';
    playWrongSound();
  }
  document.getElementById('nextBtn').style.display = 'inline-block';
}

document.getElementById('nextBtn').onclick = function() {
  playClickSound();
  currentQ++;
  if (currentQ < questions.length) {
    loadQuestion();
  } else {
    endGame();
  }
};

function endGame() {
  document.getElementById('gameScreen').style.display = 'none';
  document.getElementById('endScreen').style.display = 'block';
  document.getElementById('finalScore').textContent = score;
  var title = document.getElementById('endTitle');
  if (score === questions.length) title.textContent = '🏆 عالی! تو یک قهرمانی!';
  else if (score >= questions.length / 2) title.textContent = '😊 خوب بود! بازم تمرین کن';
  else title.textContent = '💪 اشکالی نداره، دوباره تلاش کن!';
  playEndSound();
}

document.body.addEventListener('click', function firstClick() {
  initAudio();
  if (musicEnabled && !musicInterval) startMusic();
  document.body.removeEventListener('click', firstClick);
}, { once: true });

startGame();
</script>
</body>
</html>
